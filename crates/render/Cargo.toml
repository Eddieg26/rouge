[package]
name = "render"
version = "0.1.0"
edition = "2024"

[dependencies]
ecs = { path = "../ecs" }
game = { path = "../game" }
asset = { path = "../asset" }
window = { path = "../window" }
spatial = { path = "../spatial" }
render-macros = { path = "../macros/render" }
glam = { workspace = true, features = ["serde", "bytemuck"] }
bytemuck = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
bitflags = { workspace = true }
pollster = { workspace = true }
crc32fast = { workspace = true }
downcast-rs = { workspace = true }
wgpu = { version = "23.0.0", features = ["spirv", "glsl", "serde"] }
encase = { version = "0.10.0", features = ["glam"] }
naga_oil = "0.16.0"
